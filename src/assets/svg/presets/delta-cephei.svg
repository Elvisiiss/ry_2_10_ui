<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 手绘造父四变星：不完美圆 + 抖动芒刺 -->
    <defs>
        <radialGradient id="pulseGradient">
            <stop offset="0%" stop-color="#FF9F4B" stop-opacity="0.9"/>
            <stop offset="70%" stop-color="#FF9F4B" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#0F0F12" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <!-- 核心光晕（手绘圆，路径微调） -->
    <circle cx="50" cy="50" r="18" fill="#FF9F4B" opacity="0.6"/>
    <circle cx="50" cy="50" r="12" fill="url(#pulseGradient)"/>
    <!-- 手绘芒刺：12条线，坐标带抖动 -->
    <line x1="50" y1="50" x2="78.5" y2="42.3" stroke="#FF9F4B" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="82.1" y2="60.8" stroke="#FF9F4B" stroke-width="0.9" opacity="0.3" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="75.4" y2="75.4" stroke="#FF9F4B" stroke-width="0.7" opacity="0.4" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="60.8" y2="82.1" stroke="#FF9F4B" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="42.3" y2="78.5" stroke="#FF9F4B" stroke-width="0.9" opacity="0.4" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="27.9" y2="72.3" stroke="#FF9F4B" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="21.5" y2="60.2" stroke="#FF9F4B" stroke-width="0.7" opacity="0.4" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="22.8" y2="45.6" stroke="#FF9F4B" stroke-width="0.9" opacity="0.3" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="31.2" y2="32.1" stroke="#FF9F4B" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="45.6" y2="22.8" stroke="#FF9F4B" stroke-width="0.7" opacity="0.3" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="60.2" y2="21.5" stroke="#FF9F4B" stroke-width="0.9" opacity="0.4" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="72.3" y2="27.9" stroke="#FF9F4B" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
    <!-- 额外小噪点，增加手绘感 -->
    <circle cx="53.2" cy="47.8" r="0.8" fill="#FF9F4B" opacity="0.2"/>
    <circle cx="46.5" cy="52.3" r="0.6" fill="#FF9F4B" opacity="0.2"/>
    <circle cx="51.7" cy="55.1" r="0.5" fill="#FF9F4B" opacity="0.15"/>
</svg>
