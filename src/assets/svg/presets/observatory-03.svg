          stroke-linejoin="round"/>
    <rect x="35" y="70" width="30" height="15" stroke="#F5EFE6" stroke-width="1.5" fill="none"/>
    <!-- 天线 -->
    <line x1="75" y1="35" x2="90" y2="20" stroke="#F5EFE6" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="92" cy="18" r="3" stroke="#FF9F4B" stroke-width="1" fill="none"/>
    <!-- 数字03，手写体 -->
    <text x="45" y="55" font-family="Klee One, Caveat, cursive" font-size="18" fill="#FF9F4B" opacity="0.8">03</text>
    <!-- 手绘抖动小点 -->
    <circle cx="48" cy="78" r="0.6" fill="#F5EFE6" opacity="0.3"/>
    <circle cx="62" cy="82" r="0.5" fill="#F5EFE6" opacity="0.2"/>
