<svg width="100" height="120" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- LUX 侧影轮廓：圆润机身 + 短机械臂，手绘风格 -->
    <path d="M50,30 L70,45 L70,80 L50,95 L30,80 L30,45 Z" stroke="#F5EFE6" stroke-width="2.2" fill="none"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- 头部/眼睛区域 -->
    <circle cx="50" cy="50" r="8" stroke="#F5EFE6" stroke-width="1.5" fill="none"/>
    <circle cx="50" cy="50" r="3" fill="#FF9F4B" opacity="0.7"/>
    <!-- 能源环示意 -->
    <ellipse cx="50" cy="70" rx="18" ry="8" stroke="#FF9F4B" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
    <!-- 机械臂（左侧） -->
    <path d="M35,58 L20,50 L15,35" stroke="#F5EFE6" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- 机械臂（右侧） -->
    <path d="M65,58 L80,50 L85,35" stroke="#F5EFE6" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- 手绘噪点纹理 -->
    <circle cx="42" cy="78" r="0.7" fill="#F5EFE6" opacity="0.2"/>
    <circle cx="58" cy="82" r="0.6" fill="#F5EFE6" opacity="0.2"/>
    <circle cx="55" cy="40" r="0.5" fill="#FF9F4B" opacity="0.15"/>
</svg>
