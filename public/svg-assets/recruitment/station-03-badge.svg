<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- 观测站穹顶（半圆 + 微斜墙体） -->
    <path d="M28,60
           C24,56 22,48 24,40
           C28,26 42,20 58,20
           C74,20 88,28 92,42
           C94,50 90,58 84,62"
          fill="none" stroke="#f5f1e8" stroke-width="1.2"
          stroke-linecap="round"/>

    <!-- 基座水平线（模拟地面/平台） -->
    <path d="M20,64 L80,64"
          fill="none" stroke="#f5f1e8" stroke-width="0.8"
          stroke-dasharray="3 2" opacity="0.7"/>

    <!-- 倾斜天线主杆（带轻微弯曲） -->
    <path d="M58,28
           C62,32 68,42 72,52
           C76,62 78,70 78,74"
          fill="none" stroke="#f5f1e8" stroke-width="1"
          stroke-linecap="round"/>

    <!-- 抛物面反射器（手绘弧线 + 短线模拟网格） -->
    <path d="M76,54
           C82,56 86,62 84,68
           C82,74 74,76 68,72
           C64,70 62,64 66,58
           C70,52 76,52 80,56"
          fill="none" stroke="#f5f1e8" stroke-width="0.9"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 天线细节：两条短线表现支撑结构 -->
    <path d="M72,54 L68,62" stroke="#f5f1e8" stroke-width="0.6" opacity="0.6"/>
    <path d="M78,60 L74,68" stroke="#f5f1e8" stroke-width="0.6" opacity="0.6"/>
</svg>
