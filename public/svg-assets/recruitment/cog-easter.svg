<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.08">
    <!-- 外圈：近似圆但多段贝塞尔，模拟变形磨损 -->
    <path d="M50,12
           C64,12 80,24 82,40
           C84,56 72,76 54,82
           C36,88 18,80 14,62
           C10,44 20,24 36,16
           C44,12 48,12 50,12"
          fill="none" stroke="#f5f1e8" stroke-width="1.8"
          stroke-linecap="round"/>

    <!-- 齿：故意缺失 + 断裂（共8齿，缺失2齿，1齿半截） -->
    <!-- 齿1（完整） -->
    <path d="M82,40 L92,38 L94,44 L84,46" fill="none" stroke="#f5f1e8" stroke-width="1.2"/>
    <!-- 齿2（完整） -->
    <path d="M72,70 L78,80 L84,76 L76,66" fill="none" stroke="#f5f1e8" stroke-width="1.2"/>
    <!-- 齿3（缺失）—— 不绘制 -->
    <!-- 齿4（完整） -->
    <path d="M38,84 L36,96 L44,98 L46,86" fill="none" stroke="#f5f1e8" stroke-width="1.2"/>
    <!-- 齿5（断裂：只画一半） -->
    <path d="M16,44 L6,46 L4,52 L14,50" fill="none" stroke="#f5f1e8" stroke-width="1.2"
          stroke-dasharray="3 2" opacity="0.5"/>
    <!-- 齿6（完整） -->
    <path d="M24,22 L18,12 L12,16 L20,26" fill="none" stroke="#f5f1e8" stroke-width="1.2"/>
    <!-- 齿7（缺失）—— 不绘制 -->
    <!-- 齿8（完整） -->
    <path d="M60,16 L62,4 L70,6 L66,18" fill="none" stroke="#f5f1e8" stroke-width="1.2"/>

    <!-- 内圈偏移（轴孔） -->
    <ellipse cx="48" cy="52" rx="12" ry="10"
             fill="none" stroke="#f5f1e8" stroke-width="1"
             transform="rotate(-8, 48, 52)"/>

    <!-- 额外磨损痕迹：几条短弧线 -->
    <path d="M54,44 L58,48 M46,64 L42,68 M30,48 L26,44"
          stroke="#f5f1e8" stroke-width="0.6" opacity="0.4"/>
</svg>
