<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- LUX 主体轮廓：手写扁圆，左边略平（侧视角） -->
    <path d="M32,44
           C28,34 30,20 44,16
           C58,12 76,18 80,32
           C84,46 78,62 64,68
           C50,74 34,68 30,54
           C28,48 30,44 32,44"
          fill="none" stroke="#f5f1e8" stroke-width="1.4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 内部结构线：三条短弧，模拟能源环/骨架 -->
    <path d="M44,30 C52,26 62,26 70,32"
          fill="none" stroke="#f5f1e8" stroke-width="0.7" opacity="0.6"/>
    <path d="M48,46 C56,42 64,42 72,48"
          fill="none" stroke="#f5f1e8" stroke-width="0.7" opacity="0.6"/>
    <path d="M42,58 C50,54 58,56 66,62"
          fill="none" stroke="#f5f1e8" stroke-width="0.7" opacity="0.6"/>

    <!-- 机械臂：从主体右后侧伸出，两段式，末端开口 -->
    <path d="M74,38
           C80,36 86,34 90,30
           C94,26 94,22 90,20"
          fill="none" stroke="#f5f1e8" stroke-width="1"
          stroke-linecap="round"/>

    <!-- 机械臂关节/夹爪简化示意 -->
    <path d="M90,20 L94,18 L92,22"
          fill="none" stroke="#f5f1e8" stroke-width="0.8"
          stroke-linecap="round"/>

    <!-- 第二段机械臂（更细，收起状态） -->
    <path d="M76,44 L82,40 L86,36"
          fill="none" stroke="#f5f1e8" stroke-width="0.7"
          opacity="0.7" stroke-linecap="round"/>
</svg>
