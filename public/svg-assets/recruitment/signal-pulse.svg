<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- 中心实心信号点，直径 2px（1px 半径） -->
    <circle cx="50" cy="50" r="1" fill="#f5f1e8"/>

    <!-- 第一层脉冲：实线，极轻微抖动（通过两个半弧模拟手绘） -->
    <path d="M50,12
           C44,12 38,18 38,26
           C38,34 44,40 50,40
           C56,40 62,34 62,26
           C62,18 56,12 50,12"
          fill="none" stroke="#f5f1e8" stroke-width="0.8"
          stroke-opacity="0.9"/>

    <!-- 第二层脉冲：虚线，间隙 2,2，透明度降低，位置随机偏移 -->
    <path d="M50,8
           C40,8 30,18 30,30
           C30,42 40,52 50,52
           C60,52 70,42 70,30
           C70,18 60,8 50,8"
          fill="none" stroke="#f5f1e8" stroke-width="0.7"
          stroke-dasharray="2 2" stroke-opacity="0.55"
          transform="translate(1.2, -0.8)"/>

    <!-- 第三层脉冲：更疏虚线，更淡，偏移更大 -->
    <path d="M50,2
           C36,2 22,16 22,32
           C22,48 36,62 50,62
           C64,62 78,48 78,32
           C78,16 64,2 50,2"
          fill="none" stroke="#f5f1e8" stroke-width="0.6"
          stroke-dasharray="4 4" stroke-opacity="0.25"
          transform="translate(-1.5, 1.2)"/>
</svg>
